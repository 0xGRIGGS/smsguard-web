{% extends "base.html" %}
{% block title %}Account — SMSGuard ES{% endblock %}
{% block content %}
<div class="row-between">
  <h1>Account</h1>
</div>

<div class="cards">
  <div class="card">
    <h3>Profile</h3>
    <p><strong>Name:</strong> {{ user['name'] }}</p>
    <p><strong>Email:</strong> {{ user['email'] }}</p>
    <p><strong>Member since:</strong> {{ user['created_at'] }}</p>
    <p><strong>Devices:</strong> {{ device_count }}</p>
  </div>

  <div class="card">
    <h3>Change password</h3>
    <form method="post" action="{{ url_for('auth.change_password') }}">
      <input type="hidden" name="{{ '_csrf_token' }}" value="{{ csrf_token() }}">
      <label>Current password
        <input name="current" type="password" autocomplete="current-password" required>
      </label>
      <label>New password
        <input name="new" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>Confirm new password
        <input name="confirm" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
